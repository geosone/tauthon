name: Windows compatibility build
on:
  push:
    branches: [windows/build-msvc]
    paths: ['PCbuild/**', 'packaging/windows/**', '.github/workflows/windows-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, Win32]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build and smoke test
        shell: pwsh
        run: ./packaging/windows/Build-Windows.ps1 -Architecture ${{ matrix.architecture }} -Toolset v143
      - name: Export isolated test bundle
        shell: pwsh
        run: |
          $vswhere="${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $msbuild=(& $vswhere -latest -products * -find 'MSBuild/**/Bin/MSBuild.exe' | Select-Object -First 1)
          if(!$msbuild){throw 'MSBuild not found'}
          & $msbuild packaging/windows/embedding-probe.vcxproj /t:Build /nologo /p:Configuration=Release /p:Platform=${{ matrix.architecture }} /p:PlatformToolset=v143 "/p:OutDir=$env:RUNNER_TEMP/probe/" "/p:IntDir=$env:RUNNER_TEMP/probe-obj/"
          if($LASTEXITCODE -ne 0){throw 'Cannot compile Windows embedding probe.'}
          ./packaging/windows/Export-WindowsTestBundle.ps1 -Architecture ${{ matrix.architecture }} -OutputDirectory "$env:RUNNER_TEMP/tauthon-windows-${{ matrix.architecture }}" -EmbeddingProbe "$env:RUNNER_TEMP/probe/embedding-probe.exe"
      - name: Save test bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauthon-windows-${{ matrix.architecture }}-test
          path: ${{ runner.temp }}/tauthon-windows-${{ matrix.architecture }}
          retention-days: 7
