name: Windows compatibility build
on:
  push:
    branches: [windows/build-msvc]
    paths: ['PCbuild/**', 'packaging/windows/**', '.github/workflows/windows-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build and smoke test
        shell: pwsh
        run: ./packaging/windows/Build-Windows.ps1 -Architecture x64 -Toolset v143
      - name: Export isolated test bundle
        shell: pwsh
        run: ./packaging/windows/Export-WindowsTestBundle.ps1 -OutputDirectory "$env:RUNNER_TEMP/tauthon-windows-x64"
      - name: Save test bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauthon-windows-x64-test
          path: ${{ runner.temp }}/tauthon-windows-x64
          retention-days: 7
